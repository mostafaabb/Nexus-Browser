appId: com.nexusbrowser.desktop
productName: Nexus Browser
copyright: Copyright © 2026 Nexus Browser Project
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.prettierrc,.prettierrc.json,.prettierrc.yaml,.prettierrc.js,.prettierrc.cjs,tsconfig.json,tsconfig.*.json}'
  - '!node_modules/**/{test,tests,__tests__,example,examples,doc,docs}/**'
  - '!node_modules/**/*.{md,markdown,ts,map}'

asar: true
asarUnpack:
  - node_modules/node-sqlite3-wasm/**

npmRebuild: false
buildDependenciesFromSource: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.ico
  executableName: Nexus Browser
  legalTrademarks: Nexus Browser

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexus Browser
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

publish: null
